[build-system]
requires = ["setuptools>=77"]  # first version to accept an SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "phonon-sonification"
dynamic = ["version"]
description = "Sonification of first-principles phonon data using Strauss"
readme = "phonon_sonification/README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Lucy Whalley" }]
keywords = ["sonification", "phonons", "density of states", "materials science", "strauss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "python-dotenv",
    "mp-api",
    "strauss",
]

[project.optional-dependencies]
phonopy = ["phonopy"]
test = ["pytest"]

[project.scripts]
phonon-sonify = "phonon_sonification.cli:main"
phonon-sonify-yaml = "phonon_sonification.run_from_yaml:main"

[project.urls]
Repository = "https://github.com/NU-CEM/SingingMaterials"
Issues = "https://github.com/NU-CEM/SingingMaterials/issues"
Paper = "https://arxiv.org/abs/2603.29037"

[tool.setuptools]
packages = ["phonon_sonification"]

[tool.setuptools.dynamic]
version = { attr = "phonon_sonification.__version__" }

[tool.setuptools.package-data]
phonon_sonification = ["spec_example.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
