name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      # only fetch the code: the repo also holds several hundred MB of data and audio
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            phonon_sonification
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest
