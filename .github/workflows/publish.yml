name: publish

# Publishing a GitHub release uploads the package to PyPI. The version comes from
# phonon_sonification/__init__.py, and PyPI refuses a version it has already seen.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # only fetch the code: the repo also holds several hundred MB of data and audio
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            phonon_sonification
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # trusted publishing: PyPI accepts this workflow's identity, so no API token is stored
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
